name: Base Workflow

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Execute on dry-run mode"
        required: true
        type: boolean

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
      schemas: ${{ steps.filter.outputs.schemas }}
      tables: ${{ steps.filter.outputs.tables }}
      views: ${{ steps.filter.outputs.views }}
      procedures: ${{ steps.filter.outputs.procedures }}
      tasks: ${{ steps.filter.outputs.tasks }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            migrations:
              - 'migrations/**'
            schemas:
              - 'migrations/01_schemas/**'
            tables:
              - 'migrations/02_tables/**'
            views:
              - 'migrations/03_views/**'
            procedures:
              - 'migrations/04_procedures/**'
            tasks:
              - 'migrations/05_tasks/**'
            terraform:
              - 'terraform/**'
      - name: Debug context and filters
        run: |
          echo "[detect-changes] event_name=${{ github.event_name }}"
          echo "[detect-changes] ref=${{ github.ref }}"
          echo "[detect-changes] ref_name=${{ github.ref_name }}"
          echo "[detect-changes] base_ref=${{ github.base_ref }}"
          echo "[detect-changes] effective_ref_name=${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}"
          echo "[detect-changes] head_ref=${{ github.head_ref }}"
          echo "[detect-changes] migrations=${{ steps.filter.outputs.migrations }}"
          echo "[detect-changes] schemas=${{ steps.filter.outputs.schemas }}"
          echo "[detect-changes] tables=${{ steps.filter.outputs.tables }}"
          echo "[detect-changes] views=${{ steps.filter.outputs.views }}"
          echo "[detect-changes] procedures=${{ steps.filter.outputs.procedures }}"
          echo "[detect-changes] tasks=${{ steps.filter.outputs.tasks }}"
          echo "[detect-changes] terraform=${{ steps.filter.outputs.terraform }}"
          echo "sufix=${{ ((github.event_name == 'pull_request' && github.base_ref) || github.ref_name) == 'dev' && '_DEV' || '' }}"
          echo "sufix_val_production=${{ (((github.event_name == 'pull_request' && github.base_ref) || github.ref_name) == 'production') }}"

  terraform:
    needs: detect-changes
    runs-on: ubuntu-latest

    env:
      TF_VAR_organization_name: ${{ secrets.SF_ORGANIZATION_NAME }}
      TF_VAR_account_name: ${{ secrets.SF_ACCOUNT_NAME }}
      TF_VAR_admin_user: ${{ secrets.SF_USERNAME }}
      SF_PRIVATE_KEY_B64: ${{ secrets.SF_PRIVATE_KEY_B64 }}
      TF_VAR_admin_role: ${{ secrets.SF_ROLE }}
      TF_VAR_warehouse: ${{ secrets.SF_WAREHOUSE }}
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        if: needs.detect-changes.outputs.terraform == 'true'

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        if: needs.detect-changes.outputs.terraform == 'true'
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Prepare private key
        if: needs.detect-changes.outputs.terraform == 'true'
        run: |
          echo "$SF_PRIVATE_KEY_B64" | base64 --decode > $RUNNER_TEMP/snowflake_key.p8
          chmod 600 $RUNNER_TEMP/snowflake_key.p8
          echo "TF_VAR_admin_private_key_path=$RUNNER_TEMP/snowflake_key.p8" >> $GITHUB_ENV

      - name: Terraform fmt
        if: needs.detect-changes.outputs.terraform == 'true'
        run: terraform fmt -check
        working-directory: terraform

      - name: Terraform init
        if: needs.detect-changes.outputs.terraform == 'true'
        run: terraform init
        working-directory: terraform

      - name: Terraform validate
        if: needs.detect-changes.outputs.terraform == 'true'
        run: terraform validate
        working-directory: terraform

      - name: Terraform plan
        if: needs.detect-changes.outputs.terraform == 'true'
        run: terraform plan
        working-directory: terraform

      - name: Terraform apply
        if: needs.detect-changes.outputs.terraform == 'true' && inputs.dry_run == false
        run: terraform apply -auto-approve
        working-directory: terraform

      - name: Skip - no Terraform changes
        if: needs.detect-changes.outputs.terraform != 'true'
        run: echo "No Terraform changes detected; skipping Terraform steps."

  snowsql-exec:
    needs: [detect-changes, terraform]
    if: ${{ needs.detect-changes.result == 'success' && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      SF_PRIVATE_KEY_B64: ${{ secrets.SF_PRIVATE_KEY_B64 }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
      SNOWFLAKE_USERNAME: ${{ secrets.SF_USERNAME }}
      SNOWFLAKE_ROLE: ${{ secrets.SF_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
      SCHEMAS_CHANGED: ${{ needs.detect-changes.outputs.schemas }}
      TABLES_CHANGED: ${{ needs.detect-changes.outputs.tables }}
      VIEWS_CHANGED: ${{ needs.detect-changes.outputs.views }}
      PROCEDURES_CHANGED: ${{ needs.detect-changes.outputs.procedures }}
      TASKS_CHANGED: ${{ needs.detect-changes.outputs.tasks }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set target environment variables
        run: |
          EFFECTIVE_REF="${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}"
          echo "EFFECTIVE_REF_NAME=$EFFECTIVE_REF" >> $GITHUB_ENV
          if [ "$EFFECTIVE_REF" = "production" ]; then
            echo "SNOWFLAKE_DATABASE=${{ secrets.SF_DATABASE }}" >> $GITHUB_ENV
            echo "SNOWFLAKE_ENV_SUFFIX=" >> $GITHUB_ENV
          elif [ "$EFFECTIVE_REF" = "dev" ]; then
            echo "SNOWFLAKE_DATABASE=${{ secrets.SF_DATABASE_DEV }}" >> $GITHUB_ENV
            echo "SNOWFLAKE_ENV_SUFFIX=_DEV" >> $GITHUB_ENV
          else
            # Default to dev settings if branch is not production
            echo "SNOWFLAKE_DATABASE=${{ secrets.SF_DATABASE_DEV }}" >> $GITHUB_ENV
            echo "SNOWFLAKE_ENV_SUFFIX=_DEV" >> $GITHUB_ENV
          fi

      - name: Prepare private key
        run: |
          echo "$SF_PRIVATE_KEY_B64" | base64 --decode > $RUNNER_TEMP/snowflake_key.p8
          chmod 600 $RUNNER_TEMP/snowflake_key.p8
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/snowflake_key.p8" >> $GITHUB_ENV

      - name: Install SnowSQL
        uses: Snowflake-Labs/action-install-snowsql@v1
        with:
          # Pin to a stable SnowSQL version. Update as needed.
          version: '1.2.35'

      - name: Debug context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "base_ref=${{ github.base_ref }}"
          echo "effective_ref_name=${{ env.EFFECTIVE_REF_NAME }}"
          echo "schemas_changed=${{ env.SCHEMAS_CHANGED }}"
          echo "tables_changed=${{ env.TABLES_CHANGED }}"
          echo "views_changed=${{ env.VIEWS_CHANGED }}"
          echo "procedures_changed=${{ env.PROCEDURES_CHANGED }}"
          echo "tasks_changed=${{ env.TASKS_CHANGED }}"
          echo "SNOWFLAKE_DATABASE=${{ env.SNOWFLAKE_DATABASE }}"
          echo "SNOWFLAKE_ENV_SUFFIX=${{ env.SNOWFLAKE_ENV_SUFFIX }}"
          echo "dry_run=${{ inputs.dry_run }}"

      - name: Execute SQL files with snowsql
        run: |
          set -euo pipefail
          declare -A dirs=(
            ["01_schemas"]=$SCHEMAS_CHANGED
            ["02_tables"]=$TABLES_CHANGED
            ["03_views"]=$VIEWS_CHANGED
            ["04_procedures"]=$PROCEDURES_CHANGED
            ["05_tasks"]=$TASKS_CHANGED
          )

          for folder in "${!dirs[@]}"; do
            if [ "${dirs[$folder]}" == "true" ]; then
              echo "Processing folder: $folder"
              mapfile -t files < <(find "$GITHUB_WORKSPACE/migrations/$folder" -type f -name "*.sql" | sort)
              if [ ${#files[@]} -eq 0 ]; then
                echo "No .sql files found in $folder"
                continue
              fi

              for sql_file in "${files[@]}"; do
                echo "Found SQL: $sql_file"
                if [ "${{ inputs.dry_run }}" == "true" ]; then
                  echo "DRY RUN - would execute: $sql_file"
                else
                  echo "Executing: $sql_file"
                  snowsql \
                    -a "$SNOWFLAKE_ACCOUNT" \
                    -u "$SNOWFLAKE_USERNAME" \
                    -r "$SNOWFLAKE_ROLE" \
                    -w "$SNOWFLAKE_WAREHOUSE" \
                    -d "$SNOWFLAKE_DATABASE" \
                    -o authenticator=snowflake_jwt \
                    -o private_key_path="$SNOWFLAKE_PRIVATE_KEY_PATH" \
                    -o variable_substitution=true \
                    -D DATABASE="$SNOWFLAKE_DATABASE" \
                    -D ENV_SUFFIX="$SNOWFLAKE_ENV_SUFFIX" \
                    -D SUFIX="$SNOWFLAKE_ENV_SUFFIX" \
                    -o exit_on_error=true \
                    -f "$sql_file"
                fi
              done
            fi
          done

  
